<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Exercises</title>
  <link rel="stylesheet" href="photo-gallery.css">
</head>
<body>

  <!-- PHOTO GALLERY -->
  <section class="gallery-grid">
    <div class="img-wrapper">
    <img src="../images/daniela-cuevas-t7YycgAoVSw-unsplash.jpg" alt="Image 1">
    </div>
    <div class="img-wrapper">
    <img src="../images/gustav-gullstrand-d6kSvT2xZQo-unsplash.jpg" alt="Image 2">
    </div>
    <div class="img-wrapper">
    <img src="../images/john-towner-3Kv48NS4WUU-unsplash.jpg" alt="Image 3">
    </div>
    <div class="img-wrapper">
    <img src="../images/sergei-a--heLWtuAN3c-unsplash.jpg" alt="Image 4">
    </div>
    <div class="img-wrapper">
    <img src="../images/mark-koch-KiRlN3jjVNU-unsplash.jpg" alt="Image 5">
    </div>
    <div class="img-wrapper">
    <img src="../images/tobias-keller-73F4pKoUkM0-unsplash.jpg" alt="Image 6">
  </div>
</section>

  <!-- MAGAZINE LAYOUT -->
  <section class="magazine-grid">
    <div class="header">Header</div>
    <div class="sidebar">Sidebar</div>
    <div class="main">Main Content</div>
    <div class="footer">Footer</div>
  </section>

</body>
</html>
